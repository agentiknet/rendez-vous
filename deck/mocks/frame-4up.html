<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #14140F; }
  .canvas {
    width: 1920px;
    height: 1080px;
    position: relative;
    background: #14140F;
    display: flex;
  }
  .col {
    height: 1080px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .col-phone { width: 440px; background: #0E0E0B; }
  .col-center { width: 1040px; flex-direction: column; justify-content: flex-start; padding: 20px 0; background: #101010; border-left: 2px solid #2A2A24; border-right: 2px solid #2A2A24; }

  .phone-frame {
    width: 390px;
    height: 844px;
    transform: scale(1.1282);
    border-radius: 44px;
    overflow: hidden;
    box-shadow: 0 0 0 6px #1c1c18, 0 20px 60px rgba(0,0,0,0.6);
  }
  .phone-frame iframe { width: 390px; height: 844px; border: 0; display: block; }

  .room-frame {
    width: 1040px;
    height: 640px;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  .room-frame .scaler {
    width: 1440px;
    height: 900px;
    transform: scale(0.72222);
    transform-origin: top left;
  }
  .room-frame iframe { width: 1440px; height: 900px; border: 0; display: block; }

  .term-frame { width: 1040px; height: 400px; overflow: hidden; }
  .term-frame iframe { width: 1040px; height: 400px; border: 0; display: block; }

  .clock {
    position: absolute;
    top: 22px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    background: rgba(0,0,0,0.55);
    border: 1px solid rgba(255,255,255,0.14);
    color: #F2F2F4;
    font-family: "SF Mono", Menlo, ui-monospace, monospace;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.04em;
    padding: 6px 18px;
    border-radius: 8px;
  }
</style>
</head>
<body>
<div class="canvas">
  <div class="col col-phone">
    <div class="phone-frame"><iframe src="tg-conflict.html"></iframe></div>
  </div>

  <div class="col col-center">
    <div class="room-frame"><div class="scaler"><iframe src="browser-room.html"></iframe></div></div>
    <div class="term-frame"><iframe src="terminal-atlas-band.html"></iframe></div>
  </div>

  <div class="col col-phone">
    <div class="phone-frame"><iframe src="tg-tom-conflict.html"></iframe></div>
  </div>

  <div class="clock">10:31</div>
</div>
</body>
</html>
