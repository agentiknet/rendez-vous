<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="shared.css" />
<style>
  body { background: #000; margin: 0; }
  .alert-bubble {
    border-left: 4px solid #C9962E;
    background: #FFF9EE !important;
  }
</style>
</head>
<body>
<div class="phone app-whatsapp">
  <div class="status-bar">
    <span class="time">10:31</span>
    <span class="icons">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><rect x="0" y="7" width="3" height="5" rx="0.5" fill="#000"/><rect x="4.5" y="5" width="3" height="7" rx="0.5" fill="#000"/><rect x="9" y="3" width="3" height="9" rx="0.5" fill="#000"/><rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="#000"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M8 10.5a1.1 1.1 0 100-2.2 1.1 1.1 0 000 2.2z" fill="#000"/><path d="M5 6.8a4.3 4.3 0 016 0l-1 1a2.9 2.9 0 00-4 0l-1-1z" fill="#000"/><path d="M2.4 4a8 8 0 0111.2 0l-1 1a6.6 6.6 0 00-9.2 0l-1-1z" fill="#000"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="2.5" stroke="#000" opacity="0.4"/><rect x="2" y="2" width="18" height="8" rx="1.5" fill="#000"/><rect x="22.5" y="4" width="1.6" height="4" rx="0.8" fill="#000" opacity="0.4"/></svg>
    </span>
  </div>

  <div class="chat-header">
    <svg class="back-chevron" viewBox="0 0 12 20" fill="none"><path d="M10 1L2 10l8 9" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div class="avatar" style="background:linear-gradient(135deg,#25D366,#128C7E); display:flex; align-items:center; justify-content:center; font-size:16px;">🤖</div>
    <div class="who">
      <div class="name">Agentpush</div>
      <div class="sub">en ligne</div>
    </div>
    <div class="header-icons">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M15 10l5-3v10l-5-3" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><rect x="3" y="6" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.6"/></svg>
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M3 5.5A2.5 2.5 0 015.5 3h2.6c.6 0 1.1.4 1.3 1l1 2.7c.2.5 0 1.1-.4 1.5L8.7 9.5a13 13 0 006 6l1.3-1.3c.4-.4 1-.5 1.5-.3l2.7 1c.6.2 1 .7 1 1.3v2.6A2.5 2.5 0 0118.5 21C10 21 3 14 3 5.5z" stroke="currentColor" stroke-width="1.6"/></svg>
    </div>
  </div>

  <div class="messages">
    <div class="row in">
      <div class="bubble photo" style="max-width:82%;">
        <span class="badge-attr" style="margin:4px 4px 2px;">[Tom · messenger]</span>
        <img src="../img/mock/villa-photo.png" />
        <div class="caption">Villa surf, 40 pers, juin !
          <span class="meta">10:29</span>
        </div>
      </div>
    </div>

    <div class="row in">
      <div class="bubble big-alert alert-bubble">
        <span class="title">Conflit détecté ⚠️</span>
        La villa de Tom : <b>16 000 €</b>. Ton plafond : <b>12 000 €</b>.<br/>
        Et juin tombe en période scolaire, ta contrainte.<br/><br/>
        Tom, la villa est non négociable ? Julie, flexible sur les dates ?
        <span class="meta">10:31</span>
      </div>
    </div>
  </div>

  <div class="input-bar">
    <span class="icon-btn">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M16.5 6.5l-7.8 7.8a3 3 0 004.2 4.2l8.3-8.3a5 5 0 00-7-7L5.9 11.5a7 7 0 009.9 9.9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </span>
    <div class="field" style="justify-content:space-between; padding-right:8px;">
      <span>Message</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 8a2 2 0 012-2h2l1.2-1.6h5.6L16 6h2a2 2 0 012 2v9a2 2 0 01-2 2H6a2 2 0 01-2-2V8z" stroke="rgba(0,0,0,0.32)" stroke-width="1.5"/><circle cx="12" cy="13" r="3.2" stroke="rgba(0,0,0,0.32)" stroke-width="1.5"/></svg>
    </div>
    <span class="icon-btn" style="color:#128C7E;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><path d="M12 15a3 3 0 003-3V6a3 3 0 10-6 0v6a3 3 0 003 3z" stroke="currentColor" stroke-width="1.6"/><path d="M19 11a7 7 0 01-14 0M12 18v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </span>
  </div>
</div>
</body>
</html>
